name: Build Flutter Apps (Ultimate Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. 安卓打包任务
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.1 配置 Java 环境（确保 keytool 命令可用）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1.2 手动克隆 Flutter SDK（避开有问题的插件）
      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV

      # 1.3 打印环境信息（方便你排查问题）
      - name: Check Environment
        run: |
          flutter --version
          java -version
          keytool -help

      # 1.4 安装项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 1.5 自动生成临时密钥并打包签名 APK
      - name: Build signed APK
        run: |
          keytool -genkey -v -keystore temp.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias temp \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, ST=Temp, C=US"
          flutter build apk --release \
            -Pandroid.injected.signing.store.file=$(pwd)/temp.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=temp \
            -Pandroid.injected.signing.key.password=123456

      # 1.6 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============================================================
  # 2. Windows 打包任务
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2.1 手动克隆 Flutter SDK（Windows 版）
      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable C:\flutter
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "FLUTTER_ROOT=C:\flutter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      # 2.2 安装项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 2.3 打包 Windows 应用
      - name: Build Windows
        run: flutter build windows --release

      # 2.4 上传 Windows 文件夹
      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows/x64/runner/Release
