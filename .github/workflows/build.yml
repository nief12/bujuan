name: Build Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------- Step 1: 打包 Android (APK) ----------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: true # 检出主项目指针精准匹配的子模块 commit
          fetch-depth: 0

      - name: Update Submodules to Latest
        run: |
          git submodule update --init --recursive
          git submodule foreach git pull origin master || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install Plugin Dependencies
        run: |
          cd plugin/bujuan_music_api
          flutter pub get
          cd ../..

      - name: Install Main Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  # ---------------- Step 2: 打包 Windows (EXE/Zip) ----------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update Submodules to Latest
        shell: bash
        run: |
          git submodule update --init --recursive
          git submodule foreach git pull origin master || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Plugin Dependencies
        run: |
          cd plugin/bujuan_music_api
          flutter pub get
          cd ../..

      - name: Install Main Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath bujuan-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-windows-release
          path: bujuan-windows-x64.zip

  # ---------------- Step 3: 自动发布到 Releases (推送 Tag 时执行) ----------------
  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: bujuan-android-release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: bujuan-windows-release

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            bujuan-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
