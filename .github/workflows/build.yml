name: Build Android and Windows

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch: # 支持手动触发打包

jobs:
  # -------------------------------------------------------------
  # 1. 打包 Android APK
  # -------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # -------------------------------------------------------------
  # 2. 打包 Windows 10/11 桌面客户端
  # -------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      # 压缩 Windows 产物文件夹以便下载
      - name: Compress Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "bujuan-windows-x64.zip"

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-windows-x64
          path: bujuan-windows-x64.zip
