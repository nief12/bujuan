name: Build Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------- Step 1: 打包 Android (APK) ----------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Patch Code Issues (修补原仓库代码不兼容问题)
        run: |
          # 1. 替换引用的 entity 文件名
          sed -i 's/recommend_new_song_entity.dart/recommend_song_entity.dart/g' lib/pages/home/provider.dart
          # 2. 替换调用的 API 方法名
          sed -i 's/recommendNewSong/recommendSongs/g' lib/pages/home/provider.dart
          # 3. 替换实体类型名称
          sed -i 's/RecommendNewSongEntity/RecommendSongEntity/g' lib/pages/home/provider.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install Plugin Dependencies
        run: |
          cd plugin/bujuan_music_api
          flutter pub get
          cd ../..

      - name: Install Main Dependencies
        run: flutter pub get

      - name: Build APK
        # 使用 --no-tree-shake-icons 避免矢量图标缺失导致的构建报错
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  # ---------------- Step 2: 打包 Windows (EXE/Zip) ----------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Patch Code Issues (修补原仓库代码不兼容问题)
        shell: bash
        run: |
          sed -i 's/recommend_new_song_entity.dart/recommend_song_entity.dart/g' lib/pages/home/provider.dart
          sed -i 's/recommendNewSong/recommendSongs/g' lib/pages/home/provider.dart
          sed -i 's/RecommendNewSongEntity/RecommendSongEntity/g' lib/pages/home/provider.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Plugin Dependencies
        run: |
          cd plugin/bujuan_music_api
          flutter pub get
          cd ../..

      - name: Install Main Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows Build
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath bujuan-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-windows-release
          path: bujuan-windows-x64.zip

  # ---------------- Step 3: 自动发布到 Releases (推送 Tag 时执行) ----------------
  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: bujuan-android-release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: bujuan-windows-release

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            bujuan-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
